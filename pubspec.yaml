name: ash_rise
description: "Ash Rise - volcanic precision arcade game"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── App / gray-flow stack ──
  # file_picker is intentionally NOT used — the WebView file chooser is
  # bridged natively over a MethodChannel (see MainActivity.kt), avoiding
  # the file_picker 10.x KGP clash (gray_part_pitfalls.md §1).
  webview_flutter: ^4.14.0
  webview_flutter_android: ^4.11.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^6.1.4
  appsflyer_sdk: ^6.15.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^10.0.0
  device_info_plus: ^11.3.3
  http: ^1.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon2.png"
  min_sdk_android: 26
  # Adaptive icons live on a 108dp canvas but launchers mask the outer
  # ~20% (circle / squircle / teardrop). To keep the character fully
  # visible under every mask shape we render the character on a solid
  # lava-red background with a generous inset — the foreground sits
  # inside the guaranteed 66dp safe zone.
  adaptive_icon_background: "#7A1A0A"
  adaptive_icon_foreground: "assets/icon2.png"
  adaptive_icon_foreground_inset: 18
