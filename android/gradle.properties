org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.daemon=false
org.gradle.parallel=false
android.useAndroidX=true

# Workaround for a Windows-only Kotlin daemon bug ("this and base files have
# different roots") that occurs when the Gradle/Pub caches and the project
# live on different drive letters. Incremental Kotlin compilation is disabled
# so debug/release builds succeed reliably in that setup.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
